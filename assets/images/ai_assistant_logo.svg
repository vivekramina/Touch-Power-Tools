<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant Brand Hazard Orange Gradient for Bolt -->
    <linearGradient id="lightBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Subtle Slate Shadow -->
    <filter id="lightDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Light Mode Background Circle -->
  <circle cx="50" cy="50" r="47" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Subtle Industrial Calibration Track (Precision Outer Ring) -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#f1f5f9" stroke-width="3"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="8 14" opacity="0.65"/>

  <!-- Minimalist Precision Coordinate Marks (12, 3, 6, 9 o'clock) -->
  <line x1="50" y1="12" x2="50" y2="17" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="83" x2="50" y2="88" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="17" y2="50" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="83" y1="50" x2="88" y2="50" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- AI Intelligence Core Nodes (Subtle Micro-Circuits) -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M 27 40 L 34 40 L 38 46"/>
    <circle cx="27" cy="40" r="2" fill="#0f172a"/>

    <path d="M 73 60 L 66 60 L 62 54"/>
    <circle cx="73" cy="60" r="2" fill="#0f172a"/>
  </g>

  <!-- High-Torque Power Lightning Bolt (Clean, Sharp Geometric Facets) -->
  <g filter="url(#lightDropShadow)">
    <!-- Main Bolt Body -->
    <polygon points="53,16 35,48 48,48 42,84 65,42 51,42" fill="url(#lightBoltGrad)"/>
    <!-- Dark Accent Facet for Dimensional Depth -->
    <polygon points="51,42 65,42 42,84 46,62" fill="#c2410c" opacity="0.85"/>
    <!-- Highlight Inner Core Line -->
    <polyline points="51,21 38,47 48,47 44,76" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- AI Pulse Beacon -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
</svg>
